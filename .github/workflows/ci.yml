name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          
      - name: Lint with Ruff
        run: ruff check .
        
      - name: Type check with Mypy
        run: mypy .
        
      - name: Test Quality Gate (F1 >= 0.85)
        run: |
          echo "Placeholder for pytest tests/"
          # pytest tests/
