name: Continuous Learning Pipeline (CLP)

on:
  repository_dispatch:
    types: [retrain]
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          # Required to push changes back
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"
          
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install huggingface_hub transformers datasets pydantic
          
      - name: Run Pipeline (Train CLP)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
        run: |
          python src/pipeline/train_clp.py
          
      - name: Commit and Push Manifests & Quarantine
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Ensure directories always exist before git add (avoids 'pathspec did not match' fatal)
          mkdir -p data/manifests data/quarantine data/feedback
          touch data/manifests/.gitkeep data/quarantine/.gitkeep data/feedback/.gitkeep
          git add data/manifests/ data/quarantine/ data/feedback/ || true
          # Only commit + push if there is actually something staged
          git diff --staged --quiet || git commit -m "chore: Update CLP state [manifests/quarantine] [skip ci]" && git push || true
