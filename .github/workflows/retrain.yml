name: Continuous Learning Pipeline (CLP)

on:
  repository_dispatch:
    types: [retrain]
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          # Required to push changes back
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"
          
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install huggingface_hub transformers datasets pydantic
          
      - name: Run Pipeline (Train CLP)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
        run: |
          python src/pipeline/train_clp.py
          
      - name: Commit and Push Manifests & Quarantine
        if: success() || failure()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/manifests/ data/quarantine/
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update CLP state (manifests/quarantine)" && git push)
