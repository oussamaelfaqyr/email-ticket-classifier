name: Continuous Learning Pipeline (CLP)

on:
  repository_dispatch:
    types: [retrain]
  workflow_dispatch:
    inputs:
      min_batch_size:
        description: "Minimum feedback samples required to trigger retraining (default: 50)"
        required: false
        default: "50"
      min_f1_score:
        description: "Minimum F1 score required to deploy the model (default: 0.85)"
        required: false
        default: "0.85"

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install huggingface_hub transformers datasets pydantic accelerate scikit-learn

      - name: Run Pipeline (Train CLP)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
          MIN_BATCH_SIZE: ${{ github.event.inputs.min_batch_size || github.event.client_payload.min_batch_size || '50' }}
          MIN_F1_SCORE: ${{ github.event.inputs.min_f1_score || '0.85' }}
        run: |
          python src/pipeline/train_clp.py

      - name: Commit and Push Manifests & Quarantine
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p data/manifests data/quarantine data/feedback
          touch data/manifests/.gitkeep data/quarantine/.gitkeep data/feedback/.gitkeep
          git add data/manifests/ data/quarantine/ data/feedback/ || true
          git diff --staged --quiet || (git commit -m "chore: Update CLP state [manifests/quarantine] [skip ci]" && git push) || true
