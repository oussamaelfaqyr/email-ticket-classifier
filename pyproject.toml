[project]
name = "email-ticket-classifier"
version = "0.1.0"
description = "Two-stage NLP classification system for inbound support emails"
requires-python = ">=3.10"
dependencies = [
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "mlflow>=2.5.0",
    "dvc>=3.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "streamlit>=1.30.0",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.0.280",
    "mypy>=1.5.0",
]
transformers = [
    "transformers>=4.31.0",
    "torch>=2.0.0",
    "optuna>=3.2.0",
    "datasets>=2.14.0",
    "accelerate>=1.1.0",
]

[tool.ruff]
line-length = 88

[tool.mypy]
ignore_missing_imports = true
