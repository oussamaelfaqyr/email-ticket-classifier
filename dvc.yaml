stages:
  ingest:
    cmd: python -m src.data.ingest
    outs:
      - data/raw/data.csv

  preprocess:
    cmd: python -m src.data.preprocess
    deps:
      - data/raw/data.csv
      - src/data/preprocess.py
    params:
      - base.random_state
      - data.test_size
    outs:
      - data/processed/train.csv
      - data/processed/test.csv

  build_features:
    cmd: python -m src.features.build_features
    deps:
      - data/processed/train.csv
      - data/processed/test.csv
      - src/features/build_features.py
    params:
      - features.max_features
      - features.ngram_range
    outs:
      - data/processed/vectorizer.pkl
      - data/processed/train_features.pkl
      - data/processed/test_features.pkl

  train_baseline:
    cmd: python -m src.training.baseline.train
    deps:
      - data/processed/train_features.pkl
      - data/processed/test_features.pkl
      - src/training/baseline/train.py
    params:
      - base.random_state
      - training.baseline.C
      - training.baseline.max_iter
    outs:
      - models/baseline.pkl

  train_bert:
    cmd: python -m src.training.bert.train
    deps:
      - data/processed/train.csv
      - data/processed/test.csv
      - src/training/bert/train.py
    params:
      - training.bert.model_name
      - training.bert.learning_rate
      - training.bert.epochs
      - training.bert.batch_size
      - training.bert.max_length
    outs:
      - models/bert_model

  evaluate:
    cmd: python -m src.evaluation.evaluate
    deps:
      - data/processed/test.csv
      - models/baseline.pkl
      - models/bert_model
      - src/evaluation/evaluate.py
    metrics:
      - reports/metrics_baseline.json:
          cache: false
      - reports/metrics_bert.json:
          cache: false
